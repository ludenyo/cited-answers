[project]
name = "cited-answers"
version = "0.1.0"
description = "Answers questions about Kenyan World Bank development indicators, citing the database row behind every number."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.16.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cited_answers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sorting, UP: modern syntax, B: common bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: evals

on:
  pull_request:
    paths:
      - "src/**"
      - "prompts/**"
      - "config/**"
      - "evals/**"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true  # a newer push makes the older run's model calls wasted money

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cited
          POSTGRES_PASSWORD: cited
          POSTGRES_DB: cited_answers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cited -d cited_answers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The fixture database only; CI never calls the World Bank API.
      EVAL_DATABASE_URL: postgresql://cited:cited@localhost:5432/cited_answers
      DATABASE_URL: postgresql://cited:cited@localhost:5432/cited_answers
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-haiku-5-5
      LANGFUSE_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true  # caches the uv dependency cache, keyed on uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install promptfoo
        run: npm ci

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5  # the model is pinned by name in embeddings.py

      - name: Run evals
        run: ./scripts/run_eval.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/promptfoo/output/
          if-no-files-found: warn
